<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player | مشغل الراديو</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1db954;
            --bg-color: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1a1a2e, #121212);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px; /* مساحة للمشغل السفلي */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 0 4px 10px rgba(29, 185, 84, 0.3);
        }

        /* تصميم الأقسام (الكاتيجوري) */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .category-btn:hover, .category-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.5);
        }

        /* قائمة المحطات */
        .stations-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .station-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            backdrop-filter: blur(5px);
        }

        .station-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
        }

        .station-card.playing {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.2);
        }

        .station-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .play-icon {
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* المشغل السفلي (الكوبس) */
        .bottom-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bottom-player.active {
            opacity: 1;
            pointer-events: auto;
        }

        .now-playing {
            display: flex;
            flex-direction: column;
            width: 60%;
        }

        .now-playing span {
            font-size: 0.8rem;
            color: var(--primary);
        }

        .now-playing h4 {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--primary);
        }

        #playPauseBtn {
            background: var(--primary);
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* تصميم للموبايل */
        @media (max-width: 600px) {
            .bottom-player {
                width: 95%;
                bottom: 10px;
                padding: 10px 20px;
            }
            .category-btn {
                font-size: 1rem;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-broadcast-tower"></i> Live Radio</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">أفضل الإذاعات المباشرة</p>
        </header>

        <div class="categories" id="categoriesContainer">
            </div>

        <div class="stations-list" id="stationsContainer">
            </div>
    </div>

    <div class="bottom-player" id="bottomPlayer">
        <div class="now-playing">
            <span>يتم التشغيل الآن</span>
            <h4 id="currentStationName">اختر محطة...</h4>
        </div>
        <div class="controls">
            <button class="control-btn" onclick="toggleMute()"><i id="muteIcon" class="fas fa-volume-up"></i></button>
            <button class="control-btn" id="playPauseBtn" onclick="togglePlay()"><i id="playIcon" class="fas fa-pause"></i></button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
