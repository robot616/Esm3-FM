    <style>
        :root {
            --primary: #1db954;
            --bg-dark: #0a0f16;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #121b22 0%, #0a0f16 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* العلامة المائية في الخلفية */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18vw;
            color: rgba(255, 255, 255, 0.02);
            font-weight: 900;
            white-space: nowrap;
            z-index: -1;
            pointer-events: none;
            user-select: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 40px 0;
        }

        header h1 {
            font-size: 3.5rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
            font-weight: 900;
            letter-spacing: 2px;
        }

        header p {
            color: #a0aab5;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* تصميم القوائم المنسدلة (Accordions) */
        .accordion {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: all 0.3s;
        }

        .accordion-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
        }

        .accordion-header:hover {
            background: rgba(29, 185, 84, 0.1);
        }

        .accordion-header i {
            transition: transform 0.3s;
        }

        .accordion.active .accordion-header i {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        /* كروت الإذاعات */
        .station-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
        }

        .station-card:hover {
            background: rgba(29, 185, 84, 0.1);
            border-color: rgba(29, 185, 84, 0.5);
            transform: translateY(-2px);
        }

        .station-card.playing {
            background: rgba(29, 185, 84, 0.2);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.3);
        }

        .station-card.playing .play-icon {
            color: var(--primary);
        }

        .station-info h3 {
            font-size: 1rem;
            line-height: 1.4;
        }

        .play-icon {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* المشغل السفلي */
        .bottom-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 95%;
            max-width: 600px;
            background: rgba(15, 23, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 30px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bottom-player.active {
            transform: translateX(-50%) translateY(0);
        }

        .now-playing h4 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .now-playing span {
            font-size: 0.9rem;
            color: #a0aab5;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        #playPauseBtn {
            background: var(--primary);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: transform 0.2s;
        }

        #playPauseBtn:hover {
            transform: scale(1.1);
        }

        #errorMsg {
            color: #ff4d4d;
            font-size: 0.8rem;
            display: none;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .bottom-player { padding: 15px; bottom: 15px; }
            .stations-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const parsedData = {};
        let currentCategory = "General";

        function parseM3U(data) {
            const lines = data.split('\n');
            let tempName = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line || line.includes('====') || line.includes('----') || line === '#EXTM3U') return;

                if (!line.startsWith('#') && !line.startsWith('http')) {
                    // استخدام الاسم المحسن إذا كان متوفر في القاموس
                    currentCategory = categoryNames[line] || line;
                    if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                } else if (line.startsWith('#EXTINF')) {
                    const parts = line.split(',');
                    tempName = parts.length > 1 ? parts.slice(1).join(',').replace(/_/g, ' ') : 'محطة غير معروفة';
                } else if (line.startsWith('http')) {
                    if (tempName) {
                        // محاولة ترقية الرابط لـ HTTPS لتجنب مشاكل Mixed Content
                        let finalUrl = line;
                        if(finalUrl.startsWith('http://live.mp3quran.net')) {
                            // معظم سيرفرات القرآن تدعم HTTPS الآن
                            finalUrl = finalUrl.replace('http://', 'https://');
                        }
                        
                        if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                        parsedData[currentCategory].push({ name: tempName, url: finalUrl });
                        tempName = ''; 
                    }
                }
            });
        }

        const categoriesContainer = document.getElementById('categoriesContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const bottomPlayer = document.getElementById('bottomPlayer');
        const currentStationName = document.getElementById('currentStationName');
        const playIcon = document.getElementById('playIcon');
        const errorMsg = document.getElementById('errorMsg');
        let currentPlayingCard = null;
        let hlsInstance = null; // نسخة المشغل المتقدم

        function renderUI() {
            Object.keys(parsedData).forEach((cat) => {
                const stations = parsedData[cat];
                
                // إنشاء القائمة المنسدلة (Accordion)
                const accordion = document.createElement('div');
                accordion.className = 'accordion';
                
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `<span>${cat} <small style="color:var(--primary); font-size:0.8em">(${stations.length})</small></span> <i class="fas fa-chevron-down"></i>`;
                
                const content = document.createElement('div');
                content.className = 'accordion-content';
                
                const grid = document.createElement('div');
                grid.className = 'stations-grid';

                stations.forEach(station => {
                    const card = document.createElement('div');
                    card.className = 'station-card';
                    card.innerHTML = `
                        <div class="station-info">
                            <h3>${station.name}</h3>
                        </div>
                        <i class="fas fa-play play-icon"></i>
                    `;
                    card.onclick = () => playStation(station, card);
                    grid.appendChild(card);
                });

                content.appendChild(grid);
                accordion.appendChild(header);
                accordion.appendChild(content);
                
                // منطق فتح وقفل القائمة
                header.onclick = () => {
                    const isActive = accordion.classList.contains('active');
                    document.querySelectorAll('.accordion').forEach(acc => {
                        acc.classList.remove('active');
                        acc.querySelector('.accordion-content').style.maxHeight = null;
                    });
                    
                    if (!isActive) {
                        accordion.classList.add('active');
                        content.style.maxHeight = content.scrollHeight + "px";
                    }
                };

                categoriesContainer.appendChild(accordion);
            });
        }

        function playStation(station, cardElement) {
            errorMsg.style.display = 'none';

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            }
            
            cardElement.classList.add('playing');
            cardElement.querySelector('.play-icon').className = 'fas fa-chart-bar play-icon'; // شكل متحرك مجازاً
            currentPlayingCard = cardElement;
            currentStationName.textContent = station.name;
            bottomPlayer.classList.add('active');
            playIcon.className = 'fas fa-spinner fa-spin'; // علامة تحميل

            // تدمير النسخة السابقة من HLS لو موجودة
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // استخدام مكتبة HLS للصيغ المعقدة أو المشغل الافتراضي للصيغ العادية
            if ((station.url.includes('.m3u8') || station.url.includes('.ts')) && Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(station.url);
                hlsInstance.attachMedia(audioPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    audioPlayer.play().then(() => {
                        playIcon.className = 'fas fa-pause';
                    }).catch(e => handleError());
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) handleError();
                });
            } else {
                audioPlayer.src = station.url;
                audioPlayer.play().then(() => {
                    playIcon.className = 'fas fa-pause';
                }).catch(e => handleError());
            }
        }

        function handleError() {
            playIcon.className = 'fas fa-play';
            errorMsg.style.display = 'block';
            if (currentPlayingCard) {
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            }
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
                if (currentPlayingCard) currentPlayingCard.querySelector('.play-icon').className = 'fas fa-chart-bar play-icon';
            } else {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
                if (currentPlayingCard) currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            }
        }

        function toggleMute() {
            audioPlayer.muted = !audioPlayer.muted;
            document.getElementById('muteIcon').className = audioPlayer.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        // معالجة أخطاء التشغيل الافتراضية
        audioPlayer.addEventListener('error', handleError);

        parseM3U(rawM3U);
        renderUI();
    </script>
