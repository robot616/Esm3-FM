        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --sidebar-bg: #111820;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: row-reverse;
        }

        .sidebar {
            width: 330px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .sidebar-header h2 {
            font-size: 2.2rem;
            font-weight: 900;
            background: -webkit-linear-gradient(var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .categories-container::-webkit-scrollbar { width: 5px; }
        .categories-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .accordion {
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .accordion-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .accordion-header:hover { background: rgba(0, 242, 254, 0.1); }
        .accordion.active .accordion-header {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 242, 254, 0.1);
        }
        .accordion-header i { transition: transform 0.3s; }
        .accordion.active .accordion-header i { transform: rotate(180deg); }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .station-card {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .station-card:hover { background: rgba(255,255,255,0.05); }
        .station-card.playing {
            border-right: 4px solid var(--primary);
            background: rgba(0, 242, 254, 0.08);
        }
        .station-card.playing .play-icon { color: var(--primary); }
        .station-card h3 { font-size: 0.85rem; font-weight: normal; line-height: 1.4; }

        .main-player {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #05080a;
            /* الصورة الرئيسية الثابتة هنا */
            background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1920');
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 1;
        }

        .glass-panel {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            width: 85%;
            max-width: 650px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .player-info h3 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: 700;
            line-height: 1.5;
        }

        .player-info p {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .btn-control {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .btn-control:hover { color: var(--primary); transform: scale(1.1); }

        .btn-play-pause {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #000;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s;
        }

        .btn-play-pause:hover { transform: scale(1.05); }

        .btn-stop { color: #ff4d4d; }
        .btn-stop:hover { color: #ff1a1a; text-shadow: 0 0 15px rgba(255, 77, 77, 0.6); }

        #errorMsg { color: #ff4d4d; margin-top: 15px; display: none; font-weight: bold; }

        .mobile-menu-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2.5rem;
            color: white;
            z-index: 100;
            background: none;
            border: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: row; }
            .mobile-menu-btn { display: block; right: auto; left: 20px; }
            .sidebar {
                position: absolute;
                left: -100%;
                z-index: 50;
                transition: left 0.3s;
            }
            .sidebar.show { left: 0; }
            .glass-panel { width: 95%; padding: 30px 20px; }
            .player-info h3 { font-size: 1.4rem; }
        }

        const parsedData = {};
        let currentCategory = "General";

        function parseM3U(data) {
            const lines = data.split('\n');
            let tempName = '';
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.includes('====') || line.includes('----') || line === '#EXTM3U') return;
                
                if (!line.startsWith('#') && !line.startsWith('http')) {
                    currentCategory = categoryNames[line] || line;
                    if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                } else if (line.startsWith('#EXTINF')) {
                    const parts = line.split(',');
                    if (parts.length > 1) {
                        let rawStation = parts.slice(1).join(',');
                        tempName = formatStationName(rawStation);
                    } else {
                        tempName = 'محطة غير معروفة';
                    }
                } else if (line.startsWith('http')) {
                    if (tempName) {
                        let finalUrl = line.split('#')[0]; 
                        
                        // إزالة التحويل اليدوي لأن الـ meta tag في الأعلى سيقوم بالمهمة بشكل أفضل لجميع الروابط
                        if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                        parsedData[currentCategory].push({ name: tempName, url: finalUrl, category: currentCategory });
                        tempName = ''; 
                    }
                }
            });
        }

        const categoriesContainer = document.getElementById('categoriesContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const mainStationName = document.getElementById('mainStationName');
        const mainStatusText = document.getElementById('mainStatusText');
        const playIcon = document.getElementById('playIcon');
        const errorMsg = document.getElementById('errorMsg');
        const sidebar = document.getElementById('sidebar');
        
        let currentPlayingCard = null;
        let hlsInstance = null; 

        function renderSidebar() {
            Object.keys(parsedData).forEach((cat) => {
                const stations = parsedData[cat];
                const accordion = document.createElement('div');
                accordion.className = 'accordion';
                
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `<span>${cat} <small style="opacity:0.6; font-size:0.8em">(${stations.length})</small></span> <i class="fas fa-chevron-down"></i>`;
                
                const content = document.createElement('div');
                content.className = 'accordion-content';

                stations.forEach(station => {
                    const card = document.createElement('div');
                    card.className = 'station-card';
                    card.innerHTML = `<h3>${station.name}</h3> <i class="fas fa-play play-icon"></i>`;
                    card.onclick = () => playStation(station, card);
                    content.appendChild(card);
                });

                accordion.appendChild(header);
                accordion.appendChild(content);
                
                header.onclick = () => {
                    const isActive = accordion.classList.contains('active');
                    document.querySelectorAll('.accordion').forEach(acc => {
                        acc.classList.remove('active');
                        acc.querySelector('.accordion-content').style.maxHeight = null;
                    });
                    if (!isActive) {
                        accordion.classList.add('active');
                        content.style.maxHeight = content.scrollHeight + "px";
                    }
                };
                categoriesContainer.appendChild(accordion);
            });
        }

        function playStation(station, cardElement) {
            errorMsg.style.display = 'none';
            mainStatusText.textContent = "جاري الاتصال...";

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            }
            
            cardElement.classList.add('playing');
            cardElement.querySelector('.play-icon').className = 'fas fa-music play-icon'; 
            currentPlayingCard = cardElement;
            
            mainStationName.textContent = station.name;
            playIcon.className = 'fas fa-spinner fa-spin'; 

            if(window.innerWidth <= 900) { sidebar.classList.remove('show'); }

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            // دعم قوي لمشغلات HLS مع استرداد الأخطاء
            if ((station.url.includes('.m3u8') || station.url.includes('.ts')) && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hlsInstance.loadSource(station.url);
                hlsInstance.attachMedia(audioPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    audioPlayer.play().then(onPlaySuccess).catch(handleError);
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) { 
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                handleError();
                                break;
                        }
                    }
                });
            } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl') && station.url.includes('.m3u8')) {
                // متصفحات مثل سفاري (أبل)
                audioPlayer.src = station.url;
                audioPlayer.play().then(onPlaySuccess).catch(handleError);
            } else {
                audioPlayer.src = station.url;
                audioPlayer.play().then(onPlaySuccess).catch(handleError);
            }
        }

        function onPlaySuccess() {
            playIcon.className = 'fas fa-pause';
            mainStatusText.textContent = "يتم التشغيل الآن";
            errorMsg.style.display = 'none';
        }

        function handleError() {
            playIcon.className = 'fas fa-play';
            mainStatusText.textContent = "فشل التشغيل";
            errorMsg.style.display = 'block';
            if (currentPlayingCard) currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
        }

        function togglePlay() {
            if (!audioPlayer.src && !hlsInstance) return; 
            
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
                mainStatusText.textContent = "يتم التشغيل الآن";
            } else {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
                mainStatusText.textContent = "متوقف مؤقتاً";
            }
        }

        function stopRadio() {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            audioPlayer.pause();
            audioPlayer.removeAttribute('src'); 
            audioPlayer.load(); 

            playIcon.className = 'fas fa-play';
            mainStationName.textContent = 'Esma3 Fm';
            mainStatusText.textContent = 'تم إيقاف التشغيل (توفير البيانات)';
            errorMsg.style.display = 'none';

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
                currentPlayingCard = null;
            }
        }

        function toggleMute() {
            audioPlayer.muted = !audioPlayer.muted;
            document.getElementById('muteIcon').className = audioPlayer.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        function toggleSidebar() { sidebar.classList.toggle('show'); }

        audioPlayer.addEventListener('error', handleError);

        parseM3U(rawM3U);
        renderSidebar();
    </script>
</body>
</html>
