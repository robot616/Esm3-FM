    <style>
        :root {
            --primary: #00f2fe;
            --main-bg: #0b1117;
            --sidebar-bg: #151a22;
            --box-bg: #1a2028;
            --text-main: #ffffff;
            --text-muted: #8899a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            display: flex;
        }

        /* القائمة على الشمال */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: row-reverse; 
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h2 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .categories-container::-webkit-scrollbar { width: 5px; }
        .categories-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .accordion {
            background: var(--box-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .accordion-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .accordion-header:hover { background: rgba(255, 255, 255, 0.05); }
        .accordion.active .accordion-header { color: var(--primary); }
        .accordion-header i { font-size: 0.8rem; transition: 0.3s; }
        .accordion.active .accordion-header i { transform: rotate(180deg); }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(0,0,0,0.2);
        }

        .station-card {
            padding: 12px 15px;
            border-top: 1px solid rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .station-card:hover { background: rgba(255,255,255,0.05); }
        .station-card.playing { border-right: 3px solid var(--primary); background: rgba(0, 242, 254, 0.05); }
        .station-card.playing .play-icon { color: var(--primary); }
        .station-card h3 { font-size: 0.85rem; font-weight: normal; line-height: 1.4; }
        .play-icon { font-size: 0.8rem; color: #666; }

        /* منطقة العرض الرئيسية - الصورة بكامل الشاشة */
        .main-player {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0b1117;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }

        /* اللوحة الزجاجية في المنتصف فوق الصورة */
        .glass-panel {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            width: 85%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .player-info {
            margin-bottom: 40px;
        }

        .player-info h3 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .player-info p {
            color: var(--primary);
            font-size: 1rem;
            font-weight: bold;
        }

        /* أزرار التحكم */
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-control:hover { color: var(--primary); transform: scale(1.1); }

        .btn-play-pause {
            width: 75px;
            height: 75px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            color: #000;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            transition: 0.2s;
        }
        .btn-play-pause:hover { transform: scale(1.05); }

        .btn-stop { color: #ff4d4d; }
        .btn-stop:hover { color: #ff1a1a; }

        #errorMsg { color: #ff4d4d; margin-top: 20px; display: none; font-size: 0.9rem; font-weight: bold; }

        .mobile-menu-btn {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: white;
            z-index: 100;
            background: none;
            border: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .mobile-menu-btn { display: block; }
            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                width: 80%;
                max-width: 320px;
                z-index: 50;
                transition: left 0.3s;
                border-right: none;
                box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            }
            .sidebar.show { left: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Esma3 Fm</h2>
            </div>
            <div class="categories-container" id="categoriesContainer"></div>
        </aside>

        <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

        <main class="main-player" id="mainBg">
            <div class="overlay"></div>
            
            <div class="glass-panel">
                <div class="player-info">
                    <h3 id="mainStationName">Esma3 Fm</h3>
                    <p id="mainStatusText">اختر إذاعة للبدء</p>
                </div>

                <div class="controls-wrapper">
                    <button class="btn-control" onclick="toggleMute()">
                        <i id="muteIcon" class="fas fa-volume-up"></i>
                    </button>
                    
                    <button class="btn-play-pause" id="playPauseBtn" onclick="togglePlay()">
                        <i id="playIcon" class="fas fa-play"></i>
                    </button>

                    <button class="btn-control btn-stop" onclick="stopRadio()" title="إيقاف تام">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
                
                <p id="errorMsg"></p>
            </div>

            <audio id="audioPlayer"></audio>
        </main>
    </div>

        // دالة لاختبار الصورة، لو فشلت ترجع الصورة الافتراضية
        function setSafeBackgroundImage(element, imageUrl) {
            const img = new Image();
            img.onload = function() {
                element.style.backgroundImage = \`url('\${imageUrl}')\`;
            };
            img.onerror = function() {
                element.style.backgroundImage = \`url('\${defaultImage}')\`;
            };
            img.src = imageUrl;
        }

        const parsedData = {};
        let currentCategory = "General";

        function parseM3U(data) {
            const lines = data.split('\\n');
            let tempName = '';
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.includes('====') || line.includes('----') || line === '#EXTM3U') return;
                
                if (!line.startsWith('#') && !line.startsWith('http')) {
                    currentCategory = categoryNames[line] || line;
                    if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                } else if (line.startsWith('#EXTINF')) {
                    const parts = line.split(',');
                    if (parts.length > 1) {
                        tempName = formatStationName(parts.slice(1).join(','));
                    } else {
                        tempName = 'محطة غير معروفة';
                    }
                } else if (line.startsWith('http')) {
                    if (tempName) {
                        let finalUrl = line.split('#')[0]; 
                        
                        if (window.location.protocol === 'https:' && finalUrl.startsWith('http://') && !finalUrl.includes('live.mp3quran')) {
                            finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(finalUrl);
                        } else if (finalUrl.startsWith('http://live.mp3quran.net')) {
                            finalUrl = finalUrl.replace('http://', 'https://');
                        }

                        if (!parsedData[currentCategory]) parsedData[currentCategory] = [];
                        parsedData[currentCategory].push({ name: tempName, url: finalUrl, category: currentCategory });
                        tempName = ''; 
                    }
                }
            });
        }

        const categoriesContainer = document.getElementById('categoriesContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const mainStationName = document.getElementById('mainStationName');
        const mainStatusText = document.getElementById('mainStatusText');
        const playIcon = document.getElementById('playIcon');
        const errorMsg = document.getElementById('errorMsg');
        const sidebar = document.getElementById('sidebar');
        const mainBg = document.getElementById('mainBg');
        
        let currentPlayingCard = null;
        let hlsInstance = null;
        let mpegtsInstance = null;

        function renderSidebar() {
            setSafeBackgroundImage(mainBg, getBgImage("منوعات | Mix Radio"));

            Object.keys(parsedData).forEach((cat) => {
                const stations = parsedData[cat];
                const accordion = document.createElement('div');
                accordion.className = 'accordion';
                
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = \`<span>\${cat} <small style="opacity:0.5; font-size:0.8em">(\${stations.length})</small></span> <i class="fas fa-chevron-down"></i>\`;
                
                const content = document.createElement('div');
                content.className = 'accordion-content';

                stations.forEach(station => {
                    const card = document.createElement('div');
                    card.className = 'station-card';
                    card.innerHTML = \`<h3>\${station.name}</h3> <i class="fas fa-play play-icon"></i>\`;
                    card.onclick = () => playStation(station, card);
                    content.appendChild(card);
                });

                accordion.appendChild(header);
                accordion.appendChild(content);
                
                header.onclick = () => {
                    const isActive = accordion.classList.contains('active');
                    document.querySelectorAll('.accordion').forEach(acc => {
                        acc.classList.remove('active');
                        acc.querySelector('.accordion-content').style.maxHeight = null;
                    });
                    if (!isActive) {
                        accordion.classList.add('active');
                        content.style.maxHeight = content.scrollHeight + "px";
                    }
                };
                categoriesContainer.appendChild(accordion);
            });
        }

        function playStation(station, cardElement) {
            errorMsg.style.display = 'none';
            mainStatusText.textContent = "جاري الاتصال...";

            // تغيير الخلفية لكامل الشاشة بطريقة آمنة
            setSafeBackgroundImage(mainBg, getBgImage(station.category));

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            }
            
            cardElement.classList.add('playing');
            cardElement.querySelector('.play-icon').className = 'fas fa-music play-icon'; 
            currentPlayingCard = cardElement;
            mainStationName.textContent = station.name;
            playIcon.className = 'fas fa-spinner fa-spin'; 

            if(window.innerWidth <= 900) { sidebar.classList.remove('show'); }

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }

            const isM3U8 = station.url.includes('.m3u8');
            const isTS = station.url.includes('.ts') || station.url.includes('foxfm') || station.url.includes('anisfm') || station.url.includes('beIN');

            if (isM3U8 && Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(station.url);
                hlsInstance.attachMedia(audioPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    audioPlayer.play().then(onPlaySuccess).catch(handleError);
                });
                hlsInstance.on(Hls.Events.ERROR, function(e, data) { if (data.fatal) handleError(); });
            
            } else if (isTS && typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
                try {
                    mpegtsInstance = mpegts.createPlayer({
                        type: 'mse', 
                        isLive: true,
                        url: station.url
                    });
                    mpegtsInstance.attachMediaElement(audioPlayer);
                    mpegtsInstance.load();
                    mpegtsInstance.play().then(onPlaySuccess).catch(handleError);
                } catch (e) {
                    handleError();
                }
            } else {
                audioPlayer.src = station.url;
                audioPlayer.play().then(onPlaySuccess).catch(handleError);
            }
        }

        function onPlaySuccess() {
            playIcon.className = 'fas fa-pause';
            mainStatusText.textContent = "يتم التشغيل الآن";
            errorMsg.style.display = 'none';
        }

        function handleError(e) {
            playIcon.className = 'fas fa-play';
            mainStatusText.textContent = "فشل التشغيل";
            
            if (window.location.protocol === 'https:' && audioPlayer.src && audioPlayer.src.startsWith('http://')) {
                errorMsg.innerHTML = "🚫 <b>تنبيه أمان:</b> المتصفح يحظر المحطة (http). <br>اسمح بـ <b>Insecure Content</b> من إعدادات المتصفح.";
            } else {
                errorMsg.textContent = "تعذر الاتصال بالمحطة، قد يكون البث متوقفاً.";
            }
            
            errorMsg.style.display = 'block';
            if (currentPlayingCard) currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
        }

        function togglePlay() {
            if (!audioPlayer.src && !hlsInstance && !mpegtsInstance) return; 
            
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
                mainStatusText.textContent = "يتم التشغيل الآن";
            } else {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
                mainStatusText.textContent = "متوقف مؤقتاً";
            }
        }

        function stopRadio() {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
            
            audioPlayer.pause();
            audioPlayer.removeAttribute('src'); 
            audioPlayer.load(); 

            playIcon.className = 'fas fa-play';
            mainStationName.textContent = 'Esma3 Fm';
            mainStatusText.textContent = 'تم إيقاف التشغيل (توفير البيانات)';
            errorMsg.style.display = 'none';

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
                currentPlayingCard = null;
            }
        }

        function toggleMute() {
            audioPlayer.muted = !audioPlayer.muted;
            document.getElementById('muteIcon').className = audioPlayer.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        function toggleSidebar() { sidebar.classList.toggle('show'); }

        audioPlayer.addEventListener('error', handleError);

        parseM3U(rawM3U);
        renderSidebar();
    </script>
